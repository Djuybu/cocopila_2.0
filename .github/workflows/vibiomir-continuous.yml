name: ViBioMIR continuous CPU crawl

on:
  workflow_dispatch:
  schedule:
    # Every five minutes, at all hours. Avoid the busiest minute of the hour.
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: vibiomir-continuous-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU crawl dependencies
        run: python -m pip install --quiet kaggle==2.2.4 'numpy>=1.26' 'PyYAML>=6' 'pyarrow>=16' 'requests>=2.32' 'trafilatura>=2.1,<3' 'pypdf>=5,<7' 'protego>=0.6,<1'
      - name: Collect results and keep Kaggle CPU workers occupied
        env:
          KAGGLE_OAUTH_CREDENTIALS: ${{ secrets.KAGGLE_OAUTH_CREDENTIALS }}
        run: >-
          python scripts/vibiomir_cloud_tick.py
          --owner duymaingoc --legacy-version 10
          --root "${{ runner.temp }}/vibiomir-continuous"
          --workflow-url "https://github.com/${{ github.repository }}/actions/workflows/vibiomir-continuous.yml"
      - name: Record public aggregate status
        if: always()
        run: |
          if [ -f outputs/continuous_status.json ]; then
            cat outputs/continuous_status.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the long-running schedule active
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/vibiomir_actions_keepalive.py
