[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-rag-competition"
version = "0.1.0"
description = "Modular medical retrieval competition pipeline"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "rank-bm25>=0.2.2", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
dense = ["sentence-transformers>=3", "qdrant-client>=1.9"]
parquet = ["pandas>=2.2", "pyarrow>=16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
