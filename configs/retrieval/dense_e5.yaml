extends: ../data/mmedc_prepared.yaml
retrieval:
  dense:
    enabled: true
    model: intfloat/multilingual-e5-large
    revision: 3d7cfbdacd47fdda877c5cd8a79fbcc4f2a574f3
    device: cuda
    model_dtype: float16
    model_cache_dir: ../../artifacts/cache/huggingface
    index_dir: ../../artifacts/indexes/dense/mmedc_e5_cosine
    collection: mmedc_chunks
    dimension: 1024
    max_seq_length: 512
    batch_size: 1
    text_key: text
    query_prefix: "query: "
    document_prefix: "passage: "
    distance: cosine
    normalize_embeddings: true
    top_k: 200
